<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Perfil del acuario, parámetros, dosis, alimentación y chequeo de especies conectados: cada recordatorio y diagnóstico se calcula para tu acuario real."
    />
    <title>Gupp Tank</title>
    <!--
      Runs before first paint so a saved theme or language never flashes the default.
      Storage keys must match src/lib/theme.ts and src/i18n/locales.ts.
      Language rule: URL, else saved choice (mirrors the app), else browser language if es/en, else es.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          if (localStorage.getItem('gupp-theme') === 'dark') root.dataset.theme = 'dark'
          // The URL wins (/en, /es); otherwise saved choice, else browser es/en, else es.
          var locale = location.pathname.split('/')[1]
          if (locale !== 'es' && locale !== 'en') locale = localStorage.getItem('gupp-locale')
          if (locale !== 'es' && locale !== 'en') {
            locale = (navigator.language || '').slice(0, 2).toLowerCase() === 'en' ? 'en' : 'es'
          }
          root.lang = locale
        } catch (e) {
          root.lang = 'es'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
