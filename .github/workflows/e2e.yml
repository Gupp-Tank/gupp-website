name: E2E and accessibility

# Playwright specs (axe accessibility scans, keyboard and structure checks) against
# the production build. Skipped for PRs that only touch docs.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'index.html'
      - 'public/**'
      - 'vercel.json'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (axe, keyboard, structure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
