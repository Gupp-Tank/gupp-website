name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the older run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run test:coverage
      # Production dependencies only: dev tooling is not shipped to visitors.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check:budget
